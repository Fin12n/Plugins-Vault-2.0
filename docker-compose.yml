# ==============================================================================
# Plugins Vault v2.0 - Docker Compose
# Tách riêng: 1 Container Dashboard & 1 Container Bot Discord
# Toàn bộ dữ liệu nằm trên Serverless Neon.tech PostgreSQL
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Admin Web Dashboard (Fastify + React 19 Neumorphic UI)
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: vault-dashboard
    restart: unless-stopped
    env_file: dashboard/.env
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./data/plugins:/app/dashboard/data/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Discord Bot (Discord.js + CloakBrowser + Cloudflare Turnstile Solver)
  # ----------------------------------------------------------------------------
  discord:
    build:
      context: .
      dockerfile: discord/Dockerfile
    container_name: vault-discord-bot
    restart: unless-stopped
    env_file: discord/.env
    ports:
      - "${BOT_PORT:-3001}:${PORT:-3000}"
    volumes:
      - ./data:/app/discord/data
      - ./vault:/app/discord/vault
      - ./storage:/app/discord/storage
    init: true
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
